#------------------------------------------------------------------------------
# SPEC CPU(R) 2026 config: gcc/g++/gfortran cross-compiling for Linux RISCV-64
#------------------------------------------------------------------------------
#
# Adapted for Speckle from Example-gcc-linux-riscv64.cfg (SPEC CPU 2026 v1.0.1)
# following the conventions of Speckle's SPEC CPU 2017 riscv.cfg.
#
# Cross-compiles static RISC-V binaries with the riscv64-unknown-linux-gnu-*
# toolchain (e.g. Chipyard's conda riscv-tools; requires the RISCV environment
# variable to point at the toolchain prefix, or use --define gcc_dir=...).
#
# Binaries are built with --action build only; run directories/inputs are
# staged on the host with host.cfg (see gen_binaries.sh).
#------------------------------------------------------------------------------


#--------- Label --------------------------------------------------------------
# Arbitrary string to tag binaries 
#                  Two Suggestions: # (1) EDIT this label as you try new ideas.
%define label riscv                # (2)      Use a label meaningful to *you*.


#--------- Preprocessor -------------------------------------------------------
%ifndef %{bits}                # EDIT to control 32 or 64 bit compilation.  Or, 
%   define  bits        64     #      you can set it on the command line using:
%endif                         #      'runcpu --define bits=nn'

%ifndef %{build_ncpus}         # EDIT to adjust number of simultaneous compiles.
%   define  build_ncpus  8     #      Or, you can set it on the command line: 
%endif                         #      'runcpu --define build_ncpus=nn'

# Don't change this part.
%define    os           LINUX
%if %{bits} == 64
%   define model      -march=rv64imafdc  -mabi=lp64d
%elif %{bits} == 32
%   define model        -mabi=ilp32 #untested
%else
%   error Please define number of bits - see instructions in config file
%endif



#--------- Global Settings ----------------------------------------------------
default:
   # bench_post_setup     = sync
   command_add_redirect = 1
   flagsurl             = $[top]/config/flags/gcc.xml
   ignore_errors        = 1
   iterations           = 1
   label                = %{label}-%{bits}
   line_width           = 1020
   log_line_width       = 1020
   makeflags            = --jobs=%{build_ncpus}
   mean_anyway          = 1
   output_format        = txt,html,cfg,pdf,csv
   preenv               = 1
   reportable           = 0
   tune                 = base


#--------- How Many CPUs? -----------------------------------------------------
# Both SPECrate and SPECspeed can test multiple chips / cores / hw threads
#    - For SPECrate,  you set the number of copies.
#    - For SPECspeed, you set the number of threads.
# See: https://www.spec.org/cpu2026/Docs/system-requirements.html#MultipleCPUs
#
#    q. How many should I set?
#    a. Unknown, you will have to try it and see!
#
# To get you started, some suggestions:
#
#     copies - This config file defaults to testing only 1 copy.   You might
#              try changing it to match the number of cores on your system,
#              or perhaps the number of virtual CPUs as reported by:
#                     grep -c processor /proc/cpuinfo
#              Be sure you have enough memory.  See:
#              https://www.spec.org/cpu2026/Docs/system-requirements.html#memory
#
#     threads - This config file sets a starting point, which you can adjust.
#
intrate,fprate:
   copies           = 1   # EDIT to change number of copies (see above)
intspeed,fpspeed:
   threads          = 1   # EDIT to change number of OpenMP threads (see above)


#------- Compilers ------------------------------------------------------------
default:
#                    EDIT: the directory where your compiler is installed
%ifndef %{gcc_dir}
%   define  gcc_dir           %{ENV_RISCV}
%endif

# EDIT if needed: the preENV line adds library directories to the runtime
#      path.  You can adjust it, or add lines for other environment variables.
#      See: https://www.spec.org/cpu2026/Docs/config.html#preenv
#      and: https://gcc.gnu.org/onlinedocs/gcc/Environment-Variables.html
   preENV_LD_LIBRARY_PATH  = %{gcc_dir}/lib64/:%{gcc_dir}/lib/:/lib64
  #preENV_LD_LIBRARY_PATH  = %{gcc_dir}/lib64/:%{gcc_dir}/lib/:/lib64:%{ENV_LD_LIBRARY_PATH}
   SPECLANG                = %{gcc_dir}/bin/
   CC                      = $(SPECLANG)riscv64-unknown-linux-gnu-gcc      -std=c18   %{model} -static
   CXX                     = $(SPECLANG)riscv64-unknown-linux-gnu-g++      -std=c++17 %{model} -static
   FC                      = $(SPECLANG)riscv64-unknown-linux-gnu-gfortran -std=f2018 %{model} -static
   # How to say "Show me your version, please"
   CC_VERSION_OPTION       = -v
   CXX_VERSION_OPTION      = -v
   FC_VERSION_OPTION       = -v

default:
%if %{bits} == 64
   sw_base_ptrsize = 64-bit
   sw_peak_ptrsize = 64-bit
%else
   sw_base_ptrsize = 32-bit
   sw_peak_ptrsize = 32-bit
%endif


#--------- Portability --------------------------------------------------------
default:   # data model applies to all benchmarks
%if %{bits} == 32
    # Strongly recommended because at run-time, operations using modern file 
    # systems may fail spectacularly and frequently (or, worse, quietly and 
    # randomly) if a program does not accommodate 64-bit metadata.
    EXTRA_PORTABILITY = -D_FILE_OFFSET_BITS=64
%else
    EXTRA_PORTABILITY = -DSPEC_LP64
%endif

# Benchmark-specific portability (ordered by last 2 digits of bmark number)

800.pot3d_s:
  PORTABILITY = -DSPEC_SUPPRESS_LOCAL_AND_REDUCE

710.omnetpp_r:
   PORTABILITY = -fno-finite-math-only

734.vpr_r,834.vpr_s:
   PORTABILITY = -fno-finite-math-only

735.gem5_r,835.gem5_s:
   PORTABILITY = -fno-finite-math-only

736.ocio_r:
   PORTABILITY = -fno-finite-math-only

737.gmsh_r:
   PORTABILITY = -fno-fast-math

748.flightdm_r:
   PORTABILITY = -fno-fast-math

753.ns3_r,853.ns3_s:
   PORTABILITY = -fno-finite-math-only

767.nest_r,867.nest_s:
   PORTABILITY = -fno-finite-math-only
   PORTABILITY_LIBS = -lstdc++fs

#-------- Tuning Flags common to Base and Peak --------------------------------

#
# Speed (OpenMP and Autopar allowed)
#
%if %{bits} == 32
   intspeed,fpspeed:
   fail_build = 1
%else
   intspeed,fpspeed:
      preENV_OMP_STACKSIZE = 120M
   doconcurrent:
      EXTRA_FOPTIMIZE = -ftree-parallelize-loops=1  # EDIT for how many threads you want to use
   openmp:
      EXTRA_OPTIMIZE  = -fopenmp -DSPEC_OPENMP
   cxxthreads:
      EXTRA_OPTIMIZE  = -pthread
      # https://gcc.gnu.org/onlinedocs/gcc-15.1.0/libstdc++/manual/manual/using_concurrency.html

%endif

#--------  Baseline Tuning Flags ----------------------------------------------
#
default=base:         # flags for all base 
   OPTIMIZE       = -g -O3

intrate,intspeed=base: # flags for integer base
%if %{bits} == 32                    
    EXTRA_COPTIMIZE = -fgnu89-inline -fno-strict-aliasing 
%else                                
    EXTRA_COPTIMIZE = -fno-strict-aliasing 
    LDCFLAGS        = -z muldefs     
%endif

#--------  Peak Tuning Flags ----------------------------------------------
default=peak:
   basepeak = yes  # if you develop some peak tuning, remove this line.

