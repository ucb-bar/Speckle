#------------------------------------------------------------------------------
# SPEC CPU(R) 2026 config: gcc/g++/gfortran on Linux x86 (Speckle host build)
#------------------------------------------------------------------------------
#
# Adapted for Speckle from Example-gcc-linux-x86.cfg (SPEC CPU 2026 v1.0.1).
#
# This config builds native host binaries and, more importantly, is used with
# --action runsetup to make SPEC stage the benchmark run directories (inputs)
# that gen_binaries.sh copies into the target overlay. It is also used with
# --fake --action onlyrun to generate the commands/ files (--genCommands).
#
# Requires a reasonably recent host GCC (SPEC tested CPU 2026 with GCC >= 14;
# GCC 13 is known to work for the purposes above).
#------------------------------------------------------------------------------


#--------- Label --------------------------------------------------------------
# NB: gen_binaries.sh assumes the final label is host-m64
%define label host


#--------- Preprocessor -------------------------------------------------------
%ifndef %{bits}                # EDIT to control 32 or 64 bit compilation.  Or,
%   define  bits        64     #      you can set it on the command line using:
%endif                         #      'runcpu --define bits=nn'

%ifndef %{build_ncpus}         # EDIT to adjust number of simultaneous compiles.
%   define  build_ncpus 16     #      Or, you can set it on the command line:
%endif                         #      'runcpu --define build_ncpus=nn'

# Don't change this part.
%define    os           LINUX
%if %{bits} == 64
%   define model        -m64
%elif %{bits} == 32
%   define model        -m32
%else
%   error Please define number of bits - see instructions in config file
%endif


#--------- Global Settings ----------------------------------------------------
default:
   bench_post_setup     = sync
   command_add_redirect = 1
   flagsurl             = $[top]/config/flags/gcc.xml
   ignore_errors        = 1
   iterations           = 1
   label                = %{label}-m%{bits}
   line_width           = 1020
   log_line_width       = 1020
   makeflags            = --jobs=%{build_ncpus}
   mean_anyway          = 1
   output_format        = txt,html,cfg,csv
   preenv               = 1
   reportable           = 0
   tune                 = base


#--------- How Many CPUs? -----------------------------------------------------
intrate,fprate:
   copies           = 1   # EDIT to change number of copies
intspeed,fpspeed:
   threads          = 4   # EDIT to change number of OpenMP threads


#------- Compilers ------------------------------------------------------------
default:
# EDIT: the directory where your compiler is installed (without trailing /bin)
%ifndef %{gcc_dir}
%   define  gcc_dir        "/usr"
%endif

# GCC >= 10 needs -fallow-argument-mismatch for some Fortran benchmarks.
%define GCCge10  # EDIT: comment out if using GCC 9 or earlier

   preENV_LD_LIBRARY_PATH  = %{gcc_dir}/lib64/:%{gcc_dir}/lib/:/lib64
   SPECLANG                = %{gcc_dir}/bin/
   CC                      = $(SPECLANG)gcc      -std=c18   %{model}
   CXX                     = $(SPECLANG)g++      -std=c++17 %{model}
   FC                      = $(SPECLANG)gfortran -std=f2018 %{model}
   # How to say "Show me your version, please"
   CC_VERSION_OPTION       = --version
   CXX_VERSION_OPTION      = --version
   FC_VERSION_OPTION       = --version

default:
%if %{bits} == 64
   sw_base_ptrsize = 64-bit
   sw_peak_ptrsize = 64-bit
%else
   sw_base_ptrsize = 32-bit
   sw_peak_ptrsize = 32-bit
%endif


#--------- Portability --------------------------------------------------------

800.pot3d_s:
  PORTABILITY = -DSPEC_SUPPRESS_LOCAL_AND_REDUCE

710.omnetpp_r:
   PORTABILITY = -fno-finite-math-only

734.vpr_r,834.vpr_s:
   PORTABILITY = -fno-finite-math-only

735.gem5_r,835.gem5_s:
   PORTABILITY = -fno-finite-math-only

736.ocio_r:
   PORTABILITY = -fno-finite-math-only

737.gmsh_r:
   PORTABILITY = -fno-fast-math

748.flightdm_r:
   PORTABILITY = -fno-fast-math

753.ns3_r,853.ns3_s:
   PORTABILITY = -fno-finite-math-only

767.nest_r,867.nest_s:
   PORTABILITY = -fno-finite-math-only
   PORTABILITY_LIBS = -lstdc++fs


#----------------------------------------------------------------------
#       GCC workarounds that do not count as PORTABILITY
#----------------------------------------------------------------------
%ifdef %{GCCge10}
   default:
      EXTRA_FFLAGS = -fallow-argument-mismatch
%endif

#-------- Tuning Flags common to Base and Peak --------------------------------
#
# Speed (OpenMP and Autopar allowed)
#
intspeed,fpspeed:
   preENV_OMP_STACKSIZE = 120M
doconcurrent:
   EXTRA_FOPTIMIZE = -ftree-parallelize-loops=4  # EDIT for how many threads you want to use
openmp:
   EXTRA_OPTIMIZE  = -fopenmp -DSPEC_OPENMP
cxxthreads:
   EXTRA_OPTIMIZE  = -pthread

#--------  Base Tuning Flags ----------------------------------------------
default=base:         # flags for all base
   OPTIMIZE       = -g -O3 -march=native

#--------  Peak Tuning Flags ----------------------------------------------
default:
   basepeak = yes
default=peak:


#------------------------------------------------------------------------------
# Tester and System Descriptions
#------------------------------------------------------------------------------
default:
   sw_compiler001   = C/C++/Fortran: host GCC
   sw_compiler_category = Community
   hw_vendor          = Berkeley Architecture Research
   tester             = Berkeley Architecture Research
   test_sponsor       = Berkeley Architecture Research
   license_num        = 0
   hw_cpu_name        = Unknown x86 host CPU
   hw_model           = Unknown HW Model
   sw_os001           = Linux
   power_management   = None
